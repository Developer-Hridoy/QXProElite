name: Build QX PRO ELITE APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          mkdir -p buildsrc
          unzip -q QXProElite-OneUpload.zip -d buildsrc

      - name: Build debug APK
        working-directory: buildsrc
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QX-PRO-ELITE-APK
          path: buildsrc/app/build/outputs/apk/debug/*.apk
